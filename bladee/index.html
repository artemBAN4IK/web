<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>NotesApp</title>
</head>

<body>
    <div class="app" id="app">
        <section class="sidebar">
            <div class="sidebar__icon" id="hide"></div>
            <div class="sidebar__icon"></div>
        </section>
        <section class="navbar">
            <div class="navbar__controls">
                <div>Сортировка</div>
                <input class="navbar__controls-input" type="text" placeholder="Поиск заметок">
            </div>
            <div class="navbar__scroll">
                <div class="navbar__month" id="navbar">
                </div>
            </div>
        </section>
        <section class="editor">
            <div class="editor__toolbar">
                <span>AA</span>
                <span>12 pt</span>
                <b>B</b>
                <i>I</i>
                <u>U</u>
            </div>
            <article class="editor__page">
                <div class="editor__date" id="editor-date"></div>
                <h1 class="editor__title" id="editor-title"></h1>
                <p class="editor__text" id="editor-text"></p>
            </article>
        </section>
    </div>
    <script src="./script.js"></script>
</body>
</html>
