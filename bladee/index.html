<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>NotesApp</title>
</head>

<body>
    <div class="app" id="app">
        <section class="sidebar">
            <div class="sidebar__icon"></div>
            <div class="sidebar__icon"></div>
        </section>
        <section class="navbar">
            <div class="navbar__controls">
                <div>Сортировка</div>
                <input class="navbar__controls-input" type="text" placeholder="Поиск заметок">
            </div>
            <div class="navbar__scroll">
                <div class="navbar__month" id="navbar">
                    <div class="navbar__month-note">
                        <div class="navbar__month-note-date">
                            <div class="navbar__month-note-num">13</div>
                            <div class="navbar__month-note-day">Вт</div>
                            <div class="navbar__month-note-day">2026-10-13</div>
                        </div>
                        <div class="navbar__month-note-description">
                            <div><b>Поход в магазин...</b></div>
                            <div>Купить что-то, и еще что-то и еще чтото и что то е...</div>
                        </div>
                    </div>

                    <div class="navbar__month-note navbar__month-note_active">
                        <div class="navbar__month-note-date">
                            <div class="navbar__month-note-num">13</div>
                            <div class="navbar__month-note-day">Пт</div>
                            <div class="navbar__month-note-day">2026-11-13</div>
                        </div>
                        <div class="navbar__month-note-description">
                            <div><b>Выбрать билеты на самолет...</b></div>
                            <div>Будем использовать авиасейлс...</div>
                        </div>
                    </div>

                    <div class="navbar__month-note">
                        <div class="navbar__month-note-date">
                            <div class="navbar__month-note-num">13</div>
                            <div class="navbar__month-note-day">Вс</div>
                            <div class="navbar__month-note-day">2026-12-13</div>
                        </div>
                        <div class="navbar__month-note-description">
                            <div><b>Домофон подруги...</b></div>
                            <div>103...</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="editor"></section>
    </div>

    <script src="./script.js"></script>
</body>

</html>
